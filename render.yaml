services:
  - type: web
    name: secure-shop
    env: node
    buildCommand: npm install --production
    startCommand: node server.js
    autoDeployEnabled: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheck:
      path: /health
      interval: 30
      timeout: 5
